name: sanitize-test
on:
  push:
    branches: ["ci/sanitize-8232"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless
        run: ./gradlew spotlessCheck --console=plain
        continue-on-error: true
      - name: Test
        run: ./gradlew :stirling-pdf:test --tests '*SanitizeControllerTest*' --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/core/build/reports/tests/test
